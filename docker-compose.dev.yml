name: batchbook-dev

services:

  # ── Migration guard (one-shot) ──────────────────────────────────
  # Exits 0 if DB is at Alembic HEAD; exits 1 (and blocks backend) if not.
  # Bypass: make dev BYPASS_UPDATE=1
  alembic-check:
    image: batchbook-backend:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      cache_from:
        - batchbook-backend:dev
    command: ["sh", "/app/scripts/check_migrations.sh"]
    volumes:
      - .:/app
      - backend_venv:/app/.venv          # named vol: reused across rebuilds (no orphans)
      - backend_ui_mask:/app/batchbookui  # named vol: masks the submodule from backend
    env_file:
      - .env
    environment:
      - BYPASS_MIGRATION_CHECK=${BYPASS_UPDATE:-0}
    networks:
      - batchbook

  # ── FastAPI backend ─────────────────────────────────────────────
  backend:
    image: batchbook-backend:dev         # named image = reusable cache source
    build:
      context: .
      dockerfile: Dockerfile
      target: dev                        # uses the "dev" stage (hot-reload)
      cache_from:
        - batchbook-backend:dev          # reuse layers from the last successful build
    ports:
      - "8000:8000"
    volumes:
      - .:/app                           # live-reload: host source → container
      - backend_venv:/app/.venv          # named vol: protect container's .venv (reused, no orphans)
      - backend_ui_mask:/app/batchbookui  # named vol: don't expose the submodule into backend
    env_file:
      - .env                             # DATABASE_URL, SUPABASE_URL, SUPABASE_KEY …
    networks:
      - batchbook
    restart: unless-stopped
    depends_on:
      alembic-check:
        condition: service_completed_successfully

  # ── React / Vite frontend ───────────────────────────────────────
  frontend:
    image: batchbook-frontend:dev        # named image = reusable cache source
    build:
      context: ./batchbookui
      dockerfile: Dockerfile
      target: dev                        # uses the "dev" stage (Vite HMR)
      cache_from:
        - batchbook-frontend:dev         # reuse layers from the last successful build
    ports:
      - "5173:5173"
    volumes:
      - ./batchbookui:/app               # live-reload: host source → container
      - frontend_node_modules:/app/node_modules  # named vol: protect node_modules (reused, no orphans)
    environment:
      - VITE_API_URL=http://localhost:8000   # frontend calls backend directly in dev
    networks:
      - batchbook
    restart: unless-stopped
    depends_on:
      - backend

networks:
  batchbook:
    driver: bridge

# Named volumes are reused across `make down`/`make dev` cycles instead of
# spawning a fresh anonymous volume each time (which is what silently piled up
# ~6 GB of orphaned volumes). One copy each, reused forever.
#
# ⚠️ Gotcha: a named volume keeps its contents across rebuilds. If you change
# dependencies (uv add / npm install) and the new image isn't reflected in the
# container, refresh with `make clean` or `docker compose -f docker-compose.dev.yml down -v`
# to drop these volumes so they re-init from the rebuilt image.
volumes:
  backend_venv:
  backend_ui_mask:
  frontend_node_modules:
